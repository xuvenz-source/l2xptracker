name: Windows tests and portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Install Tesseract (retry transient package feed failures)
        shell: pwsh
        run: |
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install tesseract --version=5.5.3.20260724 --yes --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path "$env:ProgramFiles\Tesseract-OCR\tesseract.exe")) {
              $ok = $true
              break
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $ok) { throw "Pinned Tesseract install failed after three attempts." }
          exit 0
      - name: Build and smoke test portable app
        run: python build_portable.py --tesseract "$env:ProgramFiles\Tesseract-OCR"
      - name: Save portable ZIP and checksum
        shell: pwsh
        run: |
          Get-ChildItem 'Share with friends' -Filter '*.zip' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: L2-Legacy-Tracker-Windows-x64
          path: |
            Share with friends/*.zip
            Share with friends/*.sha256
          if-no-files-found: error
  draft_release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: l2-tracker-draft-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: L2-Legacy-Tracker-Windows-x64
          path: release-files
      - name: Prepare draft for owner review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'from version import VERSION; print(VERSION)')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          TAG="v$VERSION"
          NAME="L2_Legacy_Tracker_$TAG""_Windows_x64_Portable.zip"
          cd release-files
          test -f "$NAME"
          test -f "$NAME.sha256"
          sha256sum -c "$NAME.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release or draft already exists; not overwriting it."
            exit 0
          fi
          gh release create "$TAG" "$NAME" "$NAME.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "L2 Legacy Tracker $TAG" --notes "Portable Windows x64 build with in-app updater. Extract the full ZIP and run L2 Legacy Tracker.exe. Review dependency notices and test on a clean Windows PC before publishing."
