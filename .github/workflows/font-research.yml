name: Native Tahoma rasterisation research
on:
  pull_request:
    paths:
      - 'gdi_tahoma.py'
      - 'calibrate_rasterisation.py'
      - 'font_library.py'
      - 'tests/test_rasterisation_calibration.py'
      - '.github/workflows/font-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_rasterisation_calibration.py -v
      - run: python calibrate_rasterisation.py --output font-research.json
      - uses: actions/upload-artifact@v4
        with:
          name: Tahoma-rasterisation-report
          path: font-research.json
          if-no-files-found: error
